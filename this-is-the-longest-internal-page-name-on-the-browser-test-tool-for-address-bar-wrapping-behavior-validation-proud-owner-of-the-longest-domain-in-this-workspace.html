<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longest URL Test Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Righteous', cursive;
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
        }
        .card {
            background: white;
            max-width: 900px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            margin: 0 0 15px;
            font-size: 2em;
            letter-spacing: 2px;
        }
        .subtitle {
            opacity: 0.6;
            margin-bottom: 30px;
            font-size: 1em;
        }
        .url-box {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            word-break: break-all;
            text-align: left;
            border: 2px solid #1a73e8;
            margin: 20px 0;
            line-height: 1.6;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 0;
        }
        .info-item {
            background: #f5f7fa;
            padding: 15px;
            border-radius: 10px;
        }
        .info-item .label {
            font-size: 0.75em;
            opacity: 0.6;
            letter-spacing: 1px;
        }
        .info-item .value {
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            color: #1a73e8;
            font-weight: bold;
            margin-top: 5px;
        }
        .back-button {
            display: inline-block;
            padding: 12px 30px;
            margin-top: 20px;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            letter-spacing: 1px;
        }
        .back-button:hover { background: #1557b0; }
        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Longest URL Test Page</h1>
        <p class="subtitle">Browser-addressBar-004 &mdash; You are now on a very long URL</p>

        <div class="url-box" id="urlBox" data-testid="long-url-box" data-value=""></div>

        <div class="info-grid">
            <div class="info-item">
                <div class="label">TOTAL URL LENGTH</div>
                <div class="value" id="urlLen" data-testid="long-url-length" data-value="">--</div>
            </div>
            <div class="info-item">
                <div class="label">FILENAME LENGTH</div>
                <div class="value" id="fileLen" data-testid="long-url-filename-length" data-value="">--</div>
            </div>
        </div>

        <p style="opacity:0.65;font-size:0.9em;line-height:1.6">
            Check how your browser's address bar wraps, truncates or scrolls this URL.<br>
            Copy-paste it and see if it opens correctly.
        </p>

        <a href="long-url.html" class="back-button">Back</a>
    </div>

    <script>
        const url = window.location.href;
        const filename = window.location.pathname.split('/').pop();
        const urlBox = document.getElementById('urlBox');
        const urlLen = document.getElementById('urlLen');
        const fileLen = document.getElementById('fileLen');
        urlBox.textContent = url;
        urlBox.setAttribute('data-value', url);
        urlLen.textContent = url.length + ' chars';
        urlLen.setAttribute('data-value', String(url.length));
        fileLen.textContent = filename.length + ' chars';
        fileLen.setAttribute('data-value', String(filename.length));
    </script>
</body>
</html>
